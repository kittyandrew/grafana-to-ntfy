name: lint

on:
  workflow_call: # ci.yml owns the push/PR triggers.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # Oct 1, 2026

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: cargo fmt
        run: nix develop -c cargo fmt --check

      - name: cargo clippy
        run: nix develop -c cargo clippy -- -D warnings

      - name: alejandra
        run: nix develop -c alejandra --check .

      - name: deadnix
        run: nix develop -c deadnix --fail --no-lambda-pattern-names .
