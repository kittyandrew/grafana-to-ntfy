name: nix flake checks

on:
  workflow_call: # ci.yml owns the push/PR triggers.

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # Oct 1, 2026

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Discover flake checks
        id: list
        # VM tests require matching-architecture KVM; CI runners are x86_64.
        run: echo "checks=$(nix flake show --json | jq -c '.checks["x86_64-linux"] | keys')" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # Oct 1, 2026

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          enable-kvm: "true"

      - name: Run ${{ matrix.check }}
        run: nix build .#checks.x86_64-linux.${{ matrix.check }} --print-build-logs --show-trace
